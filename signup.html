<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up · CartPrac</title><link rel="icon" href="server-icon.png"><link rel="stylesheet" href="assets/css/site.css"></head><body><header id="siteHeader"></header><main class="main wrap"><section class="form-card"><div class="kicker">Join the network</div><h1>Create your CartPrac account</h1><p class="muted small">Use an email address or your Google account. Your profile starts private.</p><form id="signupForm"><div class="form-row"><label for="email">Email address</label><input class="input" id="email" type="email" autocomplete="email" required></div><div class="form-row"><label for="password">Password</label><input class="input" id="password" type="password" minlength="10" autocomplete="new-password" required><span class="form-help">At least 10 characters. Never reuse your Minecraft or Google password.</span></div><div class="form-row"><label for="repeatPassword">Repeat password</label><input class="input" id="repeatPassword" type="password" minlength="10" autocomplete="new-password" required></div><div class="form-actions"><button class="btn btn-primary" type="submit">Create account</button></div></form><form id="verifyForm" class="hidden"><div class="form-row"><label for="emailCode">Email verification code</label><input class="input" id="emailCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required><span class="form-help">Enter the code sent to your inbox.</span></div><button class="btn btn-primary" type="submit">Verify email</button></form><div class="status hidden" id="formStatus" role="status"></div><div class="row" style="margin:16px 0"><div style="height:1px;background:#333;flex:1"></div><span class="small soft">OR</span><div style="height:1px;background:#333;flex:1"></div></div><button class="btn" style="width:100%" data-google-login type="button">Continue with Google</button><p class="small muted" style="margin-top:18px">Already registered? <a class="accent" href="login.html">Log in</a>.</p></section></main><div id="siteFooter"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/auth.js"></script></body></html>
