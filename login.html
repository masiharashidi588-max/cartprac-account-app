<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · CartPrac</title><link rel="icon" href="server-icon.png"><link rel="stylesheet" href="assets/css/site.css"></head><body><header id="siteHeader"></header><main class="main wrap"><section class="form-card"><div class="kicker">Welcome back</div><h1>Log in to CartPrac</h1><p class="muted small">Use your email and password or continue with Google.</p><form id="loginForm"><div class="form-row"><label for="email">Email address</label><input class="input" id="email" type="email" autocomplete="email" required></div><div class="form-row"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required></div><div class="between"><a class="small accent" href="forgot-password.html">Forgot password?</a><span class="small soft">Verified email required</span></div><div class="form-actions"><button class="btn btn-primary" type="submit">Log in</button></div></form><div class="status hidden" id="formStatus" role="status"></div><div class="row" style="margin:16px 0"><div style="height:1px;background:#333;flex:1"></div><span class="small soft">OR</span><div style="height:1px;background:#333;flex:1"></div></div><button class="btn" style="width:100%" data-google-login type="button">Continue with Google</button><p class="small muted" style="margin-top:18px">New to CartPrac? <a class="accent" href="signup.html">Create an account</a>.</p></section></main><div id="siteFooter"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/auth.js"></script></body></html>
