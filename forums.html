<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forums · CartPrac</title><link rel="icon" href="server-icon.png"><link rel="stylesheet" href="assets/css/site.css"></head><body><header id="siteHeader"></header><main class="main wrap"><section class="section"><div class="section-head"><div><div class="kicker">CartPrac community</div><h1 class="section-title">Community <span class="accent">forums</span></h1></div><a class="btn btn-primary" href="#newThread">Start a discussion</a></div><div id="forumCategories" class="tabs"></div><div id="forumThreads" class="grid grid-2"><div class="loading">Loading discussions…</div></div><div id="pageStatus" class="status hidden"></div><section id="newThread" class="card" style="margin-top:24px"><h2>Start a discussion</h2><p class="small muted">You need a CartPrac account to post. Keep personal information and credentials out of public posts.</p><form id="createThreadForm"><div class="form-row"><label for="threadCategory">Category</label><select class="select" id="threadCategory"><option value="general">General</option><option value="suggestions">Suggestions</option><option value="bug-reports">Bug reports</option><option value="creations">Builds & creations</option><option value="events">Events</option></select></div><div class="form-row"><label for="threadTitle">Title</label><input id="threadTitle" class="input" maxlength="100" required></div><div class="form-row"><label for="threadBody">Message</label><textarea id="threadBody" class="textarea" maxlength="6000" required></textarea></div><button class="btn btn-primary" type="submit">Publish thread</button></form></section></section></main><div id="siteFooter"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/pages.js"></script></body></html>
