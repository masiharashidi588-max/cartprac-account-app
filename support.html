<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support · CartPrac</title><link rel="icon" href="server-icon.png"><link rel="stylesheet" href="assets/css/site.css"></head><body><header id="siteHeader"></header><main class="main wrap"><section class="section"><div class="kicker">We're here to help</div><h1 class="section-title">CartPrac <span class="accent">support</span></h1><p class="muted">Support conversations are private to you and authorized staff.</p><div class="split" style="margin-top:20px"><div class="card"><h2>Open a support ticket</h2><form id="supportForm"><div class="form-row"><label for="ticketCategory">Category</label><select id="ticketCategory" class="select"><option>General</option><option>Account</option><option>Minecraft linking</option><option>Bug report</option><option>Store / purchase</option></select></div><div class="form-row"><label for="ticketSubject">Subject</label><input id="ticketSubject" class="input" maxlength="100" required></div><div class="form-row"><label for="ticketMessage">Describe the issue</label><textarea id="ticketMessage" class="textarea" maxlength="5000" required></textarea></div><button class="btn btn-primary">Create ticket</button></form></div><aside><h2>Your tickets</h2><div id="ticketLists" class="list"><div class="loading">Loading your tickets…</div></div></aside></div><div id="pageStatus" class="status hidden"></div></section></main><div id="siteFooter"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/pages.js"></script></body></html>
